[project]
name = "simulador-cf-materiais"
version = "0.1.0"
description = "Simulador tributário CF Materiais 2027 — motor de cálculo e API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.7", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["motor", "api"]

[tool.setuptools.package-data]
motor = ["parametros/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
